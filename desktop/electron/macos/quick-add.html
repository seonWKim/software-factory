<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Quick add</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="box">
