# The CI gate (docs/design.md §5): every pull request and every push to main runs the typecheck and the
# tests. The factory waits for these checks before it offers a reviewed PR for a human merge, and branch
# protection on main requires the `test` check (SET_UP.md). No secrets: nothing here needs a credential.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The tests commit in temporary repositories; the runner has no git identity of its own.
env:
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # A pull request runs the plain `npm test` (the `run:` line tests/check-commands.test.ts matches against
      # repo.check_commands). A push to main runs the same command with vitest's JSON report added, for the
      # slowest-files step below (docs/design/05-ci-gate.md, Slowest files).
      - run: npm test
        if: github.event_name != 'push'
      - name: npm test (with a JSON report)
        if: github.event_name == 'push'
        run: npm test -- --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/test-report.json
      - name: The 10 slowest test files
        if: always() && github.event_name == 'push'
        run: node scripts/slowest-files.mjs ${{ runner.temp }}/test-report.json

  # The dashboard at five window sizes, light and dark (docs/design/09-dashboard-app.md, Responsive check): a local
  # development check, so it is not in repo.check_commands (the factory's sandbox has no browser) and its step is
  # written as name + run, which tests/check-commands.test.ts does not count. ubuntu-latest has google-chrome.
  # WebKit needs system libraries (apt) and the browser itself. The apt part has hung for 5-10 minutes on a slow
  # mirror (docs/design/05-ci-gate.md, Cancelled checks), so it runs in its own step: apt retries and times out
  # per request, and each attempt is cut at 150 s and tried up to 3 times. The browser download is cached per
  # playwright-core version and runs only on a cache miss.
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: playwright-core version
        id: playwright
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/playwright-core/package.json', 'utf8')).version")" >> "$GITHUB_OUTPUT"
      - name: Cache of the WebKit browser
        id: webkit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The check's WebKit pass (scripts/responsive/webkit.mjs) needs playwright-core's WebKit and its system libraries.
      - name: WebKit system libraries for the responsive check
        timeout-minutes: 8
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
          for attempt in 1 2 3; do
            if timeout -k 10 150 npx playwright-core install-deps webkit; then exit 0; fi
            echo "install-deps attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1
      - name: WebKit browser for the responsive check
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright-core install webkit
      - name: npm run check:responsive
        run: npm run check:responsive
      - name: Screenshots of the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: .playwright-mcp/responsive/
          if-no-files-found: ignore
