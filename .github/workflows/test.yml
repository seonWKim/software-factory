# The CI gate (docs/design.md §5): every pull request and every push to main runs the typecheck and the
# tests. The factory waits for these checks before it offers a reviewed PR for a human merge, and branch
# protection on main requires the `test` check (SET_UP.md). No secrets: nothing here needs a credential.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The tests commit in temporary repositories; the runner has no git identity of its own.
env:
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # A pull request runs the plain `npm test` (the `run:` line tests/check-commands.test.ts matches against
      # repo.check_commands). A push to main runs the same command with vitest's JSON report added, for the
      # slowest-files step below (docs/design/05-ci-gate.md, Slowest files).
      - run: npm test
        if: github.event_name != 'push'
      - name: npm test (with a JSON report)
        if: github.event_name == 'push'
        run: npm test -- --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/test-report.json
      - name: The 10 slowest test files
        if: always() && github.event_name == 'push'
        run: node scripts/slowest-files.mjs ${{ runner.temp }}/test-report.json

  # The dashboard at five window sizes, light and dark (docs/design/09-dashboard-app.md, Responsive check): a local
  # development check, so it is not in repo.check_commands (the factory's sandbox has no browser) and its step is
  # written as name + run, which tests/check-commands.test.ts does not count. ubuntu-latest has google-chrome.
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm run check:responsive
        run: npm run check:responsive
      - name: Screenshots of the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: .playwright-mcp/responsive/
          if-no-files-found: ignore
